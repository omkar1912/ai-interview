services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: staging
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "5001:5000" # Using 5001 for staging to avoid conflict if on same host
    depends_on:
      - mongodb
        
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
    restart: always
    ports:
      - "8080:80" # Using 8080 for staging
    depends_on:
      - backend

  mongodb:
    image: mongo:6.0
    restart: always
    volumes:
      - mongodb_staging_data:/data/db

volumes:
  mongodb_staging_data:
